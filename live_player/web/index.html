<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>当前直播 · Fudan iCourse</title>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div class="shell" data-live-player-root>
    <div class="shell__backdrop" data-rail-backdrop aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <p class="brand__eyebrow">Fudan iCourse</p>
        <h1>复旦课程直播</h1>
        <p class="brand__sub">选择课程，开始听课。</p>
      </div>

      <details class="connection-settings"><summary>连接设置</summary><div class="connect">
        <label class="field">
          <span>本地播放器地址</span>
          <input data-base-url type="url" spellcheck="false" autocomplete="off" inputmode="url" placeholder="http://127.0.0.1:8000">
        </label>
        <label class="field field--token">
          <span>临时连接凭证</span>
          <input data-token type="password" spellcheck="false" autocomplete="off" placeholder="自动连接时无需填写">
        </label>
        <button class="button button--ghost" data-connect type="button">连接</button>
      </div>

      </details>
      <div class="topbar__actions">
        <button class="button button--ghost rail-toggle" data-rail-toggle type="button" aria-expanded="false">课程</button>
        <button class="button button--ghost" data-refresh type="button">刷新课程</button>
        <button class="button button--solid" data-fullscreen type="button">全屏</button>
      </div>
    </header>

    <main class="surface">
      <aside class="rail" data-rail aria-label="当前直播课程">
        <div class="rail__head">
          <div>
            <p class="rail__eyebrow">正在上课</p>
            <h2>直播课程</h2>
          </div>
          <span class="rail__count" data-course-count>0 门直播</span>
        </div>
        <div class="rail__list" data-rail-list></div>
      </aside>

      <section class="stage" data-stage>
        <div class="stage__screen">
          <video data-video class="stage__video" controls playsinline></video>
          <div class="stage__badge">当前直播</div>
        </div>

        <div class="stage__meta">
          <div class="stage__copy">
            <p class="stage__eyebrow" data-course-badge>待播放</p>
            <h2 data-course-title>选择直播课程</h2>
            <p class="stage__sub" data-course-meta>连接后选择左侧课程，即可观看当前直播。</p>
          </div>
          <button class="button button--ghost stage__mini" data-refresh type="button">刷新课程</button>
        </div>

        <p class="status" data-status aria-live="polite">请从本地播放器启动入口打开，系统会自动连接。</p>
        <p class="connection-hint" data-connection-hint></p>

        <div class="view-hint-line">
          <span data-view-hint>选择课程后可切换教师、学生画面或纯音频。</span>
          <span data-preview-line>请选择正在直播的课程。</span>
        </div>

        <div class="view-bar" data-view-bar></div>
      </section>

      <aside class="transcription-panel" data-transcription-panel aria-label="实时转录">
        <header><h2>实时转录</h2><span data-transcription-state>未开始</span></header>
        <div class="transcription-actions">
          <button type="button" data-transcription-start disabled>开始转录</button>
          <button type="button" data-transcription-stop disabled>停止</button>
          <button type="button" data-transcription-export disabled>导出 Markdown</button>
          <button type="button" data-transcription-clear disabled>清空</button>
        </div>
        <p data-transcription-status aria-live="polite">选择课程后可开始转录。</p>
        <div data-transcription-alert role="status" aria-live="assertive" hidden></div>
        <ol data-transcription-lines aria-label="实时字幕"></ol>
        <details data-transcription-settings>
          <summary>转录与提醒设置</summary>
          <div class="transcription-settings__fields">
            <label>模型 <select data-transcription-model><option value="tiny">tiny</option><option value="base">base</option><option value="small">small</option></select></label>
            <label>语言 <select data-transcription-language><option value="zh">中文</option><option value="auto">自动检测</option></select></label>
            <label class="transcription-settings__keywords">提醒关键词（以逗号分隔）<input data-transcription-keywords type="text"></label>
            <label><input data-transcription-page type="checkbox" checked> 页面提醒</label>
            <label><input data-transcription-sound type="checkbox" checked> 声音提醒</label>
            <label><input data-transcription-system type="checkbox" checked> 系统通知</label>
          </div>
        </details>
      </aside>
    </main>
  </div>

  <script src="./vendor/hls.min.js"></script>
  <script type="module">
    import { mountLivePlayerApp } from "./app.js";
    mountLivePlayerApp();
  </script>
</body>
</html>
